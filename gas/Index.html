<!DOCTYPE html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{font-family:Arial,sans-serif;color:#172b3a;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}.top{background:#075b48;color:white;padding:22px 18px;border-radius:0 0 22px 22px}.top small{opacity:.8}.top h2{margin:6px 0}.wrap{padding:15px;max-width:760px;margin:auto}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.panel{background:white;border-radius:15px;padding:15px;box-shadow:0 3px 12px #17384b12;margin-bottom:12px}.stat b{font-size:24px;display:block;color:#075b48}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button,.primary{border:0;border-radius:10px;padding:12px 15px;background:#075b48;color:white;font-weight:bold}.tabs button{flex:1;background:#dce9e5;color:#075b48}.tabs button.active{background:#075b48;color:white}label{display:block;font-size:13px;font-weight:bold;margin:11px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d6e0e5;border-radius:9px;font-size:15px;background:white}textarea{min-height:68px}.primary{width:100%;margin-top:14px}.muted{color:#6a7d88;font-size:12px}.item{padding:11px 0;border-bottom:1px solid #edf1f3}.item:last-child{border:0}.tag{font-size:11px;padding:4px 7px;border-radius:20px;background:#e3f4ed;color:#075b48}.out{background:#fff0e8;color:#a44713}.hidden{display:none}.history{max-height:430px;overflow:auto}@media(min-width:600px){.stats{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div class="top"><small>PLN ULP EMPANG</small><h2>E-LOG BARANG</h2><div>Monitoring barang masuk, keluar, dan stok</div></div>
<div class="wrap">
<div class="stats"><div class="stat"><span class="muted">Jenis Barang</span><b id="totalBarang">0</b></div><div class="stat"><span class="muted">Total Transaksi</span><b id="totalTx">0</b></div><div class="stat"><span class="muted">Stok Tercatat</span><b id="totalStok">0</b></div></div>
<div class="tabs"><button class="active" onclick="tab('form',this)">Input Transaksi</button><button onclick="tab('stok',this)">Stok Barang</button><button onclick="tab('riwayat',this)">Riwayat</button></div>
<section id="form" class="panel"><h3>Catat Transaksi</h3>
<label>Jenis Transaksi</label><select id="jenis"><option value="MASUK">Barang Masuk</option><option value="KELUAR">Barang Keluar</option></select>
<label>Nama Barang *</label><input id="nama" placeholder="Contoh: APAR, helm safety, kabel">
<label>Kode Barang (opsional)</label><input id="kode" placeholder="Kode inventaris">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Jumlah *</label><input id="jumlah" type="number" min="0.01" step="any" placeholder="0"></div><div><label>Satuan *</label><select id="satuan"><option>Unit</option><option>Pcs</option><option>Set</option><option>Box</option><option>Meter</option><option>Roll</option><option>Liter</option><option>Kg</option></select></div></div>
<label>Nama Petugas</label><input id="petugas" placeholder="Nama petugas Security / pegawai">
<label>Keterangan</label><textarea id="ket" placeholder="Catatan transaksi"></textarea>
<label>Foto Barang (opsional)</label><input id="foto" type="file" accept="image/*" capture="environment">
<div class="muted">Waktu transaksi dicatat otomatis oleh sistem.</div><button class="primary" id="save" onclick="simpan()">SIMPAN TRANSAKSI</button><div id="msg" class="muted"></div></section>
<section id="stok" class="panel hidden"><h3>Daftar Stok Barang</h3><div id="items">Memuat...</div></section>
<section id="riwayat" class="panel hidden"><h3>Riwayat Transaksi</h3><div class="history" id="history">Memuat...</div></section>
</div>
<script>
let dashboard={items:[],history:[]};
function tab(id,btn){['form','stok','riwayat'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id!=='form')load()}
function load(){google.script.run.withSuccessHandler(render).withFailureHandler(e=>alert(e.message)).getDashboard()}
function render(d){dashboard=d;document.getElementById('totalBarang').textContent=d.totalJenis;document.getElementById('totalTx').textContent=d.totalTransaksi;document.getElementById('totalStok').textContent=d.items.reduce((a,b)=>a+b.stok,0);document.getElementById('items').innerHTML=d.items.length?d.items.map(x=>'<div class="item"><b>'+esc(x.nama)+'</b><div class="muted">'+esc(x.kode)+' · '+x.stok+' '+esc(x.satuan)+'</div></div>').join(''):'Belum ada data barang';document.getElementById('history').innerHTML=d.history.length?d.history.map(x=>'<div class="item"><span class="tag '+(x.jenis==='KELUAR'?'out':'')+'">'+x.jenis+'</span> <b>'+esc(x.nama)+'</b><div>'+x.jumlah+' '+esc(x.satuan)+' · '+esc(x.petugas)+'</div><div class="muted">'+esc(x.waktu)+' · '+esc(x.keterangan)+'</div>'+(x.foto?'<a target="_blank" href="'+esc(x.foto)+'">Lihat foto</a>':'')+'</div>').join(''):'Belum ada transaksi'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function simpan(){const b=document.getElementById('save');b.disabled=true;b.textContent='MENYIMPAN...';const msg=document.getElementById('msg');try{let foto=null;const f=document.getElementById('foto').files[0];if(f){if(f.size>5*1024*1024)throw new Error('Ukuran foto maksimal 5 MB.');foto={name:f.name,mimeType:f.type||'image/jpeg',data:await toBase64(f)}}const data={jenis:jenis.value,nama:nama.value,kode:kode.value,jumlah:jumlah.value,satuan:satuan.value,petugas:petugas.value,keterangan:ket.value,foto};google.script.run.withSuccessHandler(r=>{msg.textContent='Transaksi tersimpan. Stok terbaru: '+r.stok;['nama','kode','jumlah','petugas','ket','foto'].forEach(id=>document.getElementById(id).value='');load();b.disabled=false;b.textContent='SIMPAN TRANSAKSI'}).withFailureHandler(e=>{msg.textContent=e.message;b.disabled=false;b.textContent='SIMPAN TRANSAKSI'}).saveTransaction(data)}catch(e){msg.textContent=e.message;b.disabled=false;b.textContent='SIMPAN TRANSAKSI'}}
function toBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
load();
</script></body></html>
