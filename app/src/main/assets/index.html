<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>E-LOG BARANG ULP EMPANG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:#f1f5f4;color:#18312d;font-family:Roboto,Arial,sans-serif}body{font-size:16px;-webkit-text-size-adjust:100%;touch-action:pan-y;padding-bottom:24px}.top{background:#075b48;color:white;padding:24px 18px 22px;border-radius:0 0 22px 22px}.top small{opacity:.82;letter-spacing:1px}.top h2{font-size:22px;margin:8px 0}.wrap{width:100%;max-width:560px;margin:auto;padding:14px 13px 28px}.stat,.panel{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 12px #17384b10;min-width:0}.stat b{display:block;font-size:26px;color:#075b48;margin-top:4px}.muted{color:#71817d;font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}.tabs button,.primary{border:0;border-radius:11px;padding:14px 10px;background:#075b48;color:white;font-weight:700;font-size:15px;min-height:48px}.tabs button{background:#dce9e5;color:#075b48}.tabs button.active{background:#075b48;color:#fff}label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}input,select,textarea{display:block;width:100%;max-width:100%;min-width:0;padding:13px 12px;border:1px solid #d5e0dc;border-radius:10px;font-size:16px;background:white;color:#18312d}textarea{min-height:78px;resize:vertical}.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}.primary{width:100%;margin-top:16px}.primary:disabled{opacity:.6}.note{background:#edf6f2;border-radius:10px;padding:11px;margin-top:8px}.msg{margin-top:12px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}.item{padding:13px 0;border-bottom:1px solid #edf1ef;overflow-wrap:anywhere}.item:last-child{border:0}.tag{font-size:11px;padding:5px 8px;border-radius:20px;background:#fff0e8;color:#a44713;font-weight:bold}.hidden{display:none}.history{max-height:65vh;overflow:auto}.empty{text-align:center;color:#71817d;padding:18px 4px}@media(max-width:360px){.pair{grid-template-columns:1fr}.wrap{padding-left:10px;padding-right:10px}}
</style></head><body>
<div class="top"><small>PLN ULP EMPANG</small><h2>E-LOG BARANG KELUAR</h2><div>Catatan pengeluaran barang Security</div></div>
<div class="wrap"><div class="stat"><span class="muted">Total Catatan Pengeluaran</span><b id="total">0</b></div>
<div class="tabs"><button class="active" onclick="showTab('form',this)">Input Barang Keluar</button><button onclick="showTab('history',this)">Riwayat Pengeluaran</button></div>
<section id="form" class="panel"><h3>Form Barang Keluar</h3>
<label>Nama Barang *</label><input id="nama" placeholder="Ketik nama barang" autocomplete="off">
<label>Nama Pengambil Barang *</label><input id="pengambil" placeholder="Masukkan nama pengambil barang" autocomplete="name">
<div class="pair"><div><label>Jumlah *</label><input id="jumlah" type="number" min="0.01" step="any" inputmode="decimal" placeholder="0"></div><div><label>Satuan *</label><select id="satuan"><option>Unit</option><option>Pcs</option><option>Set</option><option>Box</option><option>Meter</option><option>Roll</option><option>Liter</option><option>Kg</option></select></div></div>
<label>Nama Petugas Security *</label><select id="petugas"><option value="">Pilih petugas Security</option><option>LENY MARLINA</option><option>HERYANDI</option><option>ASEP SUANDI</option><option>FENDY PRADANA</option></select>
<label>Keterangan</label><textarea id="ket" placeholder="Catatan pengeluaran barang (opsional)"></textarea>
<label>Foto Barang (wajib dari kamera)</label><input id="foto" type="file" accept="image/*" capture="environment"><div class="muted note">Ambil foto barang menggunakan kamera HP.</div>
<div class="muted" style="margin-top:10px">Tanggal dan waktu transaksi dicatat otomatis.</div><button id="save" class="primary" onclick="save()">SIMPAN BARANG KELUAR</button><div id="msg" class="msg muted"></div></section>
<section id="history" class="panel hidden"><h3>Riwayat Pengeluaran</h3><div id="list" class="history"><div class="empty">Memuat...</div></div></section></div>
<script>
function showTab(id,btn){document.getElementById('form').classList.toggle('hidden',id!=='form');document.getElementById('history').classList.toggle('hidden',id!=='history');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(id==='history')load()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){document.getElementById('list').innerHTML='<div class="empty">Memuat riwayat...</div>';AndroidApp.getDashboard()}
window.onDashboard=function(d){document.getElementById('total').textContent=d.totalTransaksi||0;document.getElementById('list').innerHTML=(d.history||[]).length?d.history.map(x=>'<div class="item"><span class="tag">BARANG KELUAR</span> <b>'+esc(x.nama)+'</b><div>'+esc(x.jumlah)+' '+esc(x.satuan)+' · Pengambil: '+esc(x.pengambil)+'</div><div class="muted">Petugas: '+esc(x.petugas)+' · '+esc(x.waktu)+' · '+esc(x.keterangan)+'</div>'+(x.foto?'<a href="'+esc(x.foto)+'" target="_blank">Lihat foto</a>':'')+'</div>').join(''):'<div class="empty">Belum ada catatan pengeluaran.</div>'}
window.onApiError=function(e){document.getElementById('list').textContent='Gagal memuat: '+e}
window.onSaveResult=function(r){const b=document.getElementById('save'),m=document.getElementById('msg');b.disabled=false;b.textContent='SIMPAN BARANG KELUAR';if(!r.ok){m.textContent='GAGAL MENYIMPAN: '+(r.error||'Kesalahan tidak diketahui');return}m.textContent='BERHASIL: Catatan barang keluar tersimpan.';['nama','pengambil','jumlah','ket','foto'].forEach(id=>document.getElementById(id).value='');document.getElementById('satuan').value='Unit';document.getElementById('petugas').value='';AndroidApp.getDashboard()}
async function save(){const b=document.getElementById('save'),m=document.getElementById('msg');m.textContent='';const f=document.getElementById('foto').files[0];const data={jenis:'KELUAR',nama:document.getElementById('nama').value.trim(),pengambil:document.getElementById('pengambil').value.trim(),jumlah:document.getElementById('jumlah').value,satuan:document.getElementById('satuan').value,petugas:document.getElementById('petugas').value,keterangan:document.getElementById('ket').value};if(!data.nama||!data.pengambil||!data.jumlah||!data.petugas){m.textContent='Lengkapi nama barang, pengambil, jumlah, dan petugas Security.';return}if(!f){m.textContent='Ambil foto barang menggunakan kamera terlebih dahulu.';return}if(f.size>5*1024*1024){m.textContent='Ukuran foto maksimal 5 MB.';return}b.disabled=true;b.textContent='MENYIMPAN...';try{data.foto={name:'foto-barang-'+Date.now()+'.jpg',mimeType:f.type||'image/jpeg',data:await base64(f)};AndroidApp.saveTransaction(JSON.stringify(data))}catch(e){b.disabled=false;b.textContent='SIMPAN BARANG KELUAR';m.textContent='GAGAL MENYIAPKAN FOTO: '+e.message}}
function base64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
AndroidApp.getDashboard();
</script></body></html>
